# Task-only proof with pinned candidate and baseline identities.
# This workflow creates proof artifacts; it cannot land or publish.
name: PR 156941 isolated proof
run-name: PR 156941 isolated proof

on:
  push:
    branches: [test/pr-156941-isolated-proof]

permissions:
  contents: read

concurrency:
  group: pr-156941-isolated-proof
  cancel-in-progress: false

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"
  CANDIDATE_SHA: a80c18ab9df88b7c20721e06cd0d61e9044f5848
  BASE_SHA: 40a6c07e39d04bc10bf64362ba5324bbf40175a7
  CONTRIBUTOR_SHA: 17487454baa68c8901b1c9c84393135e93748a55
  BEFORE_FIX_SHA: e9dd74b55fd92227b4da8d5ea8a248d0e7dca304
  NODE_VERSION: "24.21.0"

jobs:
  proof:
    if: github.ref == 'refs/heads/test/pr-156941-isolated-proof'
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - name: Validate immutable proof inputs
        shell: bash
        run: |
          set -euo pipefail
          [[ "$CANDIDATE_SHA" =~ ^[0-9a-f]{40}$ ]]
          [[ "$BASE_SHA" =~ ^[0-9a-f]{40}$ ]]
          [[ "$RUNNER_ENVIRONMENT" == github-hosted ]]
          PROOF_DIR="$RUNNER_TEMP/pr-156941-proof"
          SQLMEASURE_PRIVATE_DIR="$RUNNER_TEMP/pr-156941-sqlmeasure-private"
          printf 'PROOF_DIR=%s\nSQLMEASURE_PRIVATE_DIR=%s\n' "$PROOF_DIR" "$SQLMEASURE_PRIVATE_DIR" >> "$GITHUB_ENV"
          mkdir -p "$PROOF_DIR"

      - name: Checkout exact candidate without retained credentials
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ env.CANDIDATE_SHA }}
          fetch-depth: 1
          persist-credentials: false
          submodules: false

      - name: Verify isolated checkout and fetch public comparison sources
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json, os, pathlib, subprocess
          root = pathlib.Path(os.environ['GITHUB_WORKSPACE'])
          assert subprocess.check_output(['git', 'rev-parse', 'HEAD'], text=True).strip() == os.environ['CANDIDATE_SHA']
          secret_names = (
              'OPENAI_API_KEY', 'ANTHROPIC_API_KEY', 'GEMINI_API_KEY', 'GOOGLE_API_KEY',
              'GH_TOKEN', 'GITHUB_TOKEN', 'NPM_TOKEN', 'NODE_AUTH_TOKEN',
              'AWS_ACCESS_KEY_ID', 'AWS_SECRET_ACCESS_KEY', 'AWS_SESSION_TOKEN',
              'GOOGLE_APPLICATION_CREDENTIALS', 'SSH_AUTH_SOCK',
          )
          assert not any(os.environ.get(name) for name in secret_names), 'Unexpected task credential in proof environment'
          credential_config = subprocess.run(
              ['git', 'config', '--get-regexp', r'http\..*extraheader'],
              text=True, stdout=subprocess.PIPE, stderr=subprocess.PIPE,
          )
          assert credential_config.returncode == 1, 'Git authentication remained after checkout'
          evidence = {key: os.environ[key] for key in ('CANDIDATE_SHA', 'BASE_SHA', 'CONTRIBUTOR_SHA', 'BEFORE_FIX_SHA')}
          evidence['runner'] = os.environ['RUNNER_ENVIRONMENT']
          evidence['negativeControlKind'] = 'source-derived pre-fix hunks on the exact candidate, not a full old-main run'
          pathlib.Path(os.environ['PROOF_DIR'], 'identity.json').write_text(json.dumps(evidence, indent=2) + '\n')
          PY
          git -c core.hooksPath=/dev/null fetch --no-tags --depth=1 \
            https://github.com/openclaw/openclaw.git "$BASE_SHA" "$CONTRIBUTOR_SHA" "$BEFORE_FIX_SHA"

      - name: Checkout reviewed measurement sources from the exact proof commit
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          path: .proof-assets
          fetch-depth: 1
          persist-credentials: false
          submodules: false
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            /.sqlmeasure/run.mts
            /.sqlmeasure/observer.cjs
            /.sqlmeasure/calibrate.cjs
            /.sqlmeasure/analyze.py

      - name: Materialize measurement sources without historical artifacts
        shell: bash
        run: |
          set -euo pipefail
          test ! -e .sqlmeasure
          mkdir .sqlmeasure
          for source in run.mts observer.cjs calibrate.cjs analyze.py; do
            cp ".proof-assets/.sqlmeasure/$source" ".sqlmeasure/$source"
          done
          sha256sum .sqlmeasure/run.mts .sqlmeasure/observer.cjs \
            .sqlmeasure/calibrate.cjs .sqlmeasure/analyze.py > "$PROOF_DIR/sqlmeasure-source.sha256"

      - name: Setup maintained Node and pnpm toolchain
        uses: ./.github/actions/setup-node-env
        with:
          node-version: "24.21.0"
          install-bun: "false"
          cache-mode: "off"
          semantic-checks: "true"

      - name: Install ripgrep for baseline ratchets
        shell: bash
        run: |
          set -euo pipefail
          if command -v rg >/dev/null 2>&1; then
            exit 0
          fi
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends ripgrep

      - name: Build candidate
        env:
          OUTPUT_SOURCE_MAPS: "1"
          OPENCLAW_BUILD_PRIVATE_QA: "1"
        shell: bash
        run: |
          set -euo pipefail
          /usr/bin/time -v -o "$PROOF_DIR/build.time.txt" pnpm build 2>&1 | tee "$PROOF_DIR/build.log"

      - name: Calibrate main-thread and worker-thread SQL observation
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$PROOF_DIR/sqlmeasure-calibration"
          printf 'calibration\n' > "$PROOF_DIR/sqlmeasure-calibration/phase"
          SQLMEASURE_OUT="$PROOF_DIR/sqlmeasure-calibration" \
            NODE_OPTIONS="--require=$PWD/.sqlmeasure/observer.cjs --enable-source-maps" \
            node .sqlmeasure/calibrate.cjs
          python3 - <<'PY'
          import json, os, pathlib
          root = pathlib.Path(os.environ['PROOF_DIR'], 'sqlmeasure-calibration')
          threads = set()
          for trace in root.glob('sql-*.jsonl'):
              rows = [json.loads(line) for line in trace.read_text().splitlines()]
              process = next(row for row in rows if isinstance(row, dict) and row.get('type') == 'process')
              sites = {row['id']: row for row in rows if isinstance(row, dict) and row.get('type') == 'site'}
              calls = [sites[row[1]] for row in rows if isinstance(row, list)]
              assert len(calls) == 8 and all(call['ok'] for call in calls), 'Observer lost calibration calls'
              assert sum(call['method'] == 'prepare' for call in calls) == 2, 'Observer preparation count changed'
              threads.add('main' if process['isMainThread'] else 'worker')
          assert threads == {'main', 'worker'}, 'Observer did not instrument both thread classes'
          maps = list(pathlib.Path('dist').rglob('*.map'))
          assert any(any('src/gateway/server-methods/chat-send-session.ts' in source for source in json.loads(item.read_text()).get('sources', [])) for item in maps), 'First-turn source map missing'
          PY

      - name: Run the complete synthetic SQL measurement workload
        id: sqlmeasure
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$SQLMEASURE_PRIVATE_DIR"
          # Raw connect evidence can contain newly minted fixture credentials.
          # Keep all raw logs/state outside the uploaded proof directory.
          PROOF_DIR="$SQLMEASURE_PRIVATE_DIR" \
            node --import ./scripts/tsx.mjs .sqlmeasure/run.mts \
            > "$SQLMEASURE_PRIVATE_DIR/harness.log" 2>&1

      - name: Analyze SQL attribution and export only redacted proof
        if: ${{ always() && !cancelled() && steps.sqlmeasure.outcome != 'skipped' }}
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json, os, pathlib, subprocess
          private = pathlib.Path(os.environ['SQLMEASURE_PRIVATE_DIR'])
          runs = list(private.glob('sqlmeasure-run-*'))
          assert len(runs) == 1, 'Expected exactly one measurement run'
          run = runs[0]
          evidence = json.loads((run / 'evidence.json').read_text())
          public = pathlib.Path(os.environ['PROOF_DIR'], 'sqlmeasure')
          public.mkdir()
          secret_fields = {'deviceToken', 'deviceTokens', 'token', 'password', 'secret', 'privateKey', 'apiKey'}
          secret_values = set()
          def collect(value, secret=False):
              if isinstance(value, dict):
                  for key, item in value.items(): collect(item, secret or key in secret_fields)
              elif isinstance(value, list):
                  for item in value: collect(item, secret)
              elif secret and isinstance(value, str) and value:
                  secret_values.add(value)
          collect(evidence)
          def redact(value):
              if isinstance(value, dict):
                  return {key: '[redacted]' if key in secret_fields else redact(item) for key, item in value.items()}
              if isinstance(value, list): return [redact(item) for item in value]
              if isinstance(value, str):
                  for secret in sorted(secret_values, key=len, reverse=True): value = value.replace(secret, '[redacted]')
              return value
          (public / 'evidence.json').write_text(json.dumps(redact(evidence), indent=2) + '\n')
          analysis = subprocess.run(['python3', '.sqlmeasure/analyze.py', str(run)], text=True, stdout=subprocess.PIPE, stderr=subprocess.STDOUT)
          (public / 'summary.log').write_text(redact(analysis.stdout))
          if (run / 'analysis.json').is_file():
              (public / 'analysis.json').write_text(json.dumps(redact(json.loads((run / 'analysis.json').read_text())), indent=2) + '\n')
          # These traces contain SQL source text and stacks, never statement bindings.
          for trace in run.glob('sql-*.jsonl'):
              rows = [redact(json.loads(line)) for line in trace.read_text().splitlines()]
              (public / trace.name).write_text(''.join(json.dumps(row) + '\n' for row in rows))
          assert analysis.returncode == 0, 'SQL attribution failed; inspect redacted summary'
          assert evidence.get('head') == os.environ['CANDIDATE_SHA'], 'Measurement candidate identity changed'
          assert evidence.get('ok') is True and 'error' not in evidence, 'Full measurement workload failed; inspect redacted evidence'
          assert len(evidence['turns']) == 13 and all(turn['result']['status'] == 'ok' for turn in evidence['turns']), 'Expected all thirteen synthetic turns'
          assert evidence['childTerminal']['status'] == 'ok' and evidence['compaction']['compacted'] is True
          assert any(entry.get('status') == 'ok' for entry in evidence['cronRuns']['entries']), 'Synthetic cron did not succeed'
          assert evidence['shutdown'] == [0, None], 'Gateway did not shut down cleanly'
          # Phase 02 includes sessions.create and background settlement. Preserve
          # totals + stack attribution; the focused boundary tests own the zero-SQL claim.
          PY

      - name: Compare the exact candidate against released Plugin SDK selectors
        shell: bash
        run: |
          set -euo pipefail
          # This task does not modify the SDK comparison tool or its public renderer.
          git diff --exit-code "$BASE_SHA" "$CANDIDATE_SHA" -- \
            scripts/plugin-sdk-api-diff.mts src/plugin-sdk/api-diff.ts \
            scripts/plugin-sdk-api-release-evidence.mjs \
            scripts/lib/npm-json-output.mts scripts/lib/release-version.mjs \
            scripts/openclaw-npm-extended-stable-release.mjs
          bases_json="$(node --input-type=module <<'NODE'
          import { execFileSync } from 'node:child_process';
          import { readFileSync } from 'node:fs';
          import { resolveNpmJsonEntries } from './scripts/lib/npm-json-output.mts';
          import { parseReleaseVersion } from './scripts/lib/release-version.mjs';
          import { resolveNpmPreflightSdkSelectors } from './scripts/openclaw-npm-extended-stable-release.mjs';
          const selectors = resolveNpmPreflightSdkSelectors(JSON.parse(readFileSync('package.json', 'utf8')).version, 'latest');
          const entries = resolveNpmJsonEntries(JSON.parse(execFileSync('npm', ['view', 'openclaw', 'dist-tags', '--json'], { encoding: 'utf8' })));
          if (entries.length !== 1) throw new Error('Expected one public selector map');
          const refs = Object.fromEntries(selectors.map(selector => {
            const version = entries[0]?.[selector];
            if (typeof version !== 'string' || !parseReleaseVersion(version)) throw new Error('Invalid public release selector');
            return [selector, `v${version}`];
          }));
          process.stdout.write(JSON.stringify(refs));
          NODE
          )"
          mapfile -t refs < <(jq -r '.[] | "+refs/tags/\(.):refs/tags/\(.)"' <<< "$bases_json" | sort -u)
          git -c core.hooksPath=/dev/null fetch --no-tags --depth=1 origin "${refs[@]}"
          if [[ "$(jq 'length' <<< "$bases_json")" == 2 ]]; then
            base_args=(--bases-json "$bases_json")
          else
            base_args=(--base "$(jq -r '.[]' <<< "$bases_json")")
          fi
          pnpm plugin-sdk:api:diff -- \
            --head "$CANDIDATE_SHA" "${base_args[@]}" \
            --evidence "$PROOF_DIR/plugin-sdk-release-evidence.json" \
            --json "$PROOF_DIR/plugin-sdk-release-diff.json" \
            --summary "$GITHUB_STEP_SUMMARY" \
            > "$PROOF_DIR/plugin-sdk-release.log" 2>&1

      - name: Run focused candidate and import-closure proof
        env:
          OPENCLAW_VITEST_FS_MODULE_CACHE_PATH: ${{ runner.temp }}/pr-156941-positive-cache
        shell: bash
        run: |
          set -euo pipefail
          /usr/bin/time -v -o "$PROOF_DIR/focused.time.txt" \
            node scripts/run-vitest.mjs \
            src/gateway/server.chat-membership-authority.product.test.ts \
            src/gateway/gateway-allowlist-store-read-failure.e2e.test.ts \
            src/gateway/server.chat.gateway-server-chat-b.test.ts \
            src/gateway/operator-role-policy.test.ts \
            src/gateway/session-access-authority.test.ts \
            src/gateway/session-row-projection.worker-read.test.ts \
            src/gateway/server-methods/mcp-app-onboarding.test.ts \
            src/gateway/server.sessions.preview-resolve.test.ts \
            src/gateway/server-methods/control-ui.session-preview.test.ts \
            test/e2e/qa-lab/runtime/channel-progress-presentation.e2e.test.ts \
            test/scripts/shrink-ratchet.test.ts \
            test/scripts/check-test-mock-exports.test.ts \
            src/acp/control-plane/spawn.test.ts \
            src/gateway/server-methods/plugins.lifecycle-contention.test.ts \
            src/gateway/server-plugin-in-process-dispatch.session-scopes.test.ts \
            src/gateway/server/ws-connection/authenticated-request-dispatch.mutation-authority.test.ts \
            src/gateway/session-utils.queued-collector.test.ts \
            src/gateway/server.chat.orphaned-recovery.test.ts \
            src/gateway/server-methods/chat.directive-tags.test.ts \
            src/auto-reply/reply/agent-runner-required-maintenance.pending-input.test.ts \
            test/e2e/qa-lab/runtime/gateway-rpc-chat.e2e.test.ts \
            src/gateway/server-methods/chat-send-admission.reads.test.ts \
            src/gateway/server-methods/chat-send-global-identity.test.ts \
            src/gateway/server-methods/chat-send-profile-binding.test.ts \
            src/gateway/session-sharing.worker.test.ts \
            src/gateway/session-utils-store-lookup.test.ts \
            src/config/sessions/combined-store-gateway.test.ts \
            src/config/sessions/session-entry-read.worker.test.ts \
            src/config/sessions/session-entry-readonly.worker.test.ts \
            src/config/sessions/session-sharing-store.worker.test.ts \
            src/config/sessions/session-canonical-key-policy.test.ts \
            src/config/sessions/session-canonical-validation-readiness.test.ts \
            src/infra/sqlite-schema-facts.test.ts \
            src/infra/session-cost-usage-cache.admission.test.ts \
            src/infra/session-cost-usage-cache.worker.test.ts \
            src/state/openclaw-agent-db-read-error.test.ts \
            src/state/openclaw-agent-db-readonly-scope.test.ts \
            src/state/openclaw-state-db-readonly.retained.test.ts \
            src/gateway/server-methods/usage.sessions-usage-owner-attribution.integration.test.ts \
            src/gateway/server-worker-placement-reclaim.preparation.test.ts \
            src/gateway/server-worker-placement-reclaim.test.ts \
            src/agents/embedded-agent-runner/run/model-setup.ownership.test.ts \
            src/gateway/server-methods/chat-send-work-admission.test.ts \
            src/gateway/server-methods/chat-send-pending-inputs.test.ts \
            src/gateway/server-methods/chat-send-steering-custody.test.ts \
            src/gateway/server-methods/sessions.initial-transfer-custody.test.ts \
            src/gateway/server-methods.session-pending-stop.test.ts \
            src/gateway/server-methods/chat.native-runtime-consent.test.ts \
            src/gateway/server-methods/session-recovery-continuation.test.ts \
            src/gateway/server.sessions.recover.test.ts \
            test/scripts/runtime-process-build-graph.test.ts \
            src/auto-reply/reply/get-reply.imports.test.ts \
            src/state/openclaw-state.worker.imports.test.ts \
            --maxWorkers=1 --reporter=default 2>&1 | tee "$PROOF_DIR/focused.log"
          python3 - <<'PYCODE'
          import os, pathlib, re
          output = pathlib.Path(os.environ['PROOF_DIR'], 'focused.log').read_text()
          output = re.sub(r'\x1b\[[0-9;]*m', '', output)
          assert not re.search(r'(?mi)^\s*(?:error during close|close timed out after)|^[^\n]*⎯[^\n]*Unhandled (?:Error|Rejection|Exception)', output), 'Focused test teardown or unhandled error remains'
          PYCODE

      - name: Run explicit worker ratchet and Madge checks
        shell: bash
        run: |
          set -euo pipefail
          pnpm check:database-worker-ratchet --base "$BASE_SHA" 2>&1 | tee "$PROOF_DIR/worker-ratchet.log"
          pnpm check:test-mock-exports --base "$BASE_SHA" 2>&1 | tee "$PROOF_DIR/mock-exports-ratchet.log"
          pnpm check:madge-import-cycles 2>&1 | tee "$PROOF_DIR/madge.log"

      - name: Prove the restored pre-fix hunks fail at their intended assertions
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json, os, pathlib, re, subprocess, time
          import xml.etree.ElementTree as ET

          root = pathlib.Path.cwd()
          output = pathlib.Path(os.environ['PROOF_DIR'])
          sql_file = 'src/gateway/server-methods/chat-send-admission.reads.test.ts'
          sql_title = 'prepares and authorizes a first chat turn without caller-thread SQL'
          sql_assertion = 'expect(sql.queries, sql.queries.join("\\n")).toEqual([]);'
          join_file = 'src/gateway/server-methods/chat-send-profile-binding.test.ts'
          join_title = 'retains callback custody after its real worker reader is revoked'

          # Keep current-main codecs and worker contracts, restoring only the old
          # owner behavior. Full old-main code is incompatible with the new tests.
          load_file = 'src/gateway/server-methods/chat-send-session.ts'
          load_old = '''    () =>
                request.stopCommand
                  ? loadSessionEntry(sessionLoadKey, sessionLoadOptions, runtimeConfig)
                  : withGatewaySessionEntry(
                      sessionLoadKey,
                      sessionLoadOptions,
                      (entry) => entry,
                      runtimeConfig,
                      assertConfigCurrent,
                    ),'''
          load_new = '    () => loadSessionEntry(sessionLoadKey, sessionLoadOptions, runtimeConfig),'
          base_source = subprocess.check_output(['git', 'show', f"{os.environ['BASE_SHA']}:{load_file}"], text=True)
          assert load_new in base_source, 'Pinned main did not use the claimed synchronous loader'

          pre_file = 'src/gateway/server-methods/chat-send-pre-admission.ts'
          pre_old = '  await consumeChatSendCurrent(params, () => {});\n  const retrySession = {'
          pre_new = '  params.assertCurrent?.();\n  const retrySession = {'
          pre_base = subprocess.check_output(['git', 'show', f"{os.environ['BASE_SHA']}:{pre_file}"], text=True)
          assert pre_new in pre_base, 'Pinned main did not use the claimed synchronous post-claim authority check'

          join_source = 'src/gateway/server-methods/chat-send-admission.ts'
          join_old = '''    // Reader cleanup may reject after starting effects. Join them before releasing
              // custody, preserving the original authority failure without replaying work.
              if (startedWork) {
                await Promise.allSettled([startedWork()]);
              }
              cleanupPreDispatchAdmission();
              throw error;'''
          join_new = '    cleanupPreDispatchAdmission();\n    throw error;'
          original_source = subprocess.check_output(['git', 'show', f"{os.environ['CONTRIBUTOR_SHA']}:{join_source}"], text=True)
          assert join_new in original_source, 'Original contributor source did not contain the unjoined cleanup'

          reservation_title = 'clears a pending reservation when its retained reader is revoked after publication'
          reservation_old = '''  const reserved = await consumeChatSendCurrent(params, reserve).catch((error: unknown) => {
              pendingReservation.clear();
              throw error;
            });'''
          reservation_new = '  const reserved = await consumeChatSendCurrent(params, reserve);'
          # The contributor awaited the publication without cleanup. Keep the current
          # helper spelling while restoring that same unguarded await, not the old API.
          original_reservation = '''  const { goalReservationConflict, goalRetry, retrySettled } = params.withCurrent
              ? await params.withCurrent(inspectRetryAndReserve)
              : inspectRetryAndReserve();'''
          assert original_reservation in original_source, 'Original contributor source did not contain the unguarded reservation await'

          acp_old = '  // Explicit metadata, including misses, keeps this synchronous resolver off SQLite.\n  let deletedAgentId = resolveDeletedAgentIdFromSessionKey(cfg, sessionKey, entry, {\n    acpMeta: null,\n  });\n  if (deletedAgentId !== null) {\n    const [acpMeta] = await readAcpSessionMetaForEntries({\n      cfg,\n      entries: [{ agentId: deletedAgentId, sessionKey: legacyKey ?? sessionKey, entry }],\n    });\n    deletedAgentId = resolveDeletedAgentIdFromSessionKey(cfg, sessionKey, entry, {\n      acpMeta: acpMeta ?? null,\n    });\n  }'
          acp_new = '  const deletedAgentId = resolveDeletedAgentIdFromSessionKey(cfg, sessionKey, entry, {\n    acpMetadataSessionKey: legacyKey ?? sessionKey,\n  });'
          assert acp_new in base_source, 'Pinned main did not use the claimed synchronous ACP lookup'

          receipt_file = 'src/gateway/server-methods/request-authorization.ts'
          receipt_old = '          assertInvocationCurrent: params.assertInvocationCurrent,\n          assertPreparationCurrent,'
          receipt_new = '          assertInvocationCurrent: assertPreparationCurrent,\n          assertPreparationCurrent,'
          router_before = subprocess.check_output(['git', 'show', f"{os.environ['BEFORE_FIX_SHA']}:src/gateway/server-methods.ts"], text=True)
          lost_receipt = '        assertInvocationCurrent: () => {\n          runtimeParticipant?.assertCurrent();\n          profileBinding?.assertCurrent();\n          assertOperatorCurrent();\n          requestMutationAuthority.assertPreparationCurrent();\n        },'
          assert lost_receipt in router_before, 'Recorded candidate did not bind preparation as its invocation guard'

          profile_file = 'src/gateway/session-sharing-authorization-async.ts'
          profile_old = '        preparedProfiles,\n'
          profile_new = ''
          profile_before = subprocess.check_output(['git', 'show', f"{os.environ['BEFORE_FIX_SHA']}:{profile_file}"], text=True)
          assert '        ...params,\n        preparedSharing: { ...read, assertCurrent },' in profile_before, 'Recorded candidate did not omit prepared profile facts'

          row_file = 'src/sessions/session-row-facts.ts'
          row_old = (root / row_file).read_text().split('): boolean {\n', 1)[1]
          row_before = subprocess.check_output(['git', 'show', f"{os.environ['BEFORE_FIX_SHA']}:{row_file}"], text=True)
          row_new = row_before.split('): boolean {\n', 1)[1]
          assert 'Boolean(change.storePath)' in row_new and 'matchesStore' in row_old, 'Recorded cross-store invalidation boundary drifted'

          controls = [
              ('initial-sync-lookup', load_file, load_old, load_new, sql_file, sql_title, sql_assertion, 2),
              ('sync-acp-lookup', load_file, acp_old, acp_new, sql_file, 'prepares canonical free ACP without caller-thread SQL', 'expect(sql.queries, sql.queries.join("\\n")).toHaveLength(0);', 1),
              ('post-claim-sync-authority', pre_file, pre_old, pre_new, sql_file, sql_title, sql_assertion, 2),
              ('unjoined-callback', join_source, join_old, join_new, join_file, join_title, 'expect(released).toBeDefined();', 1),
              ('uncleared-reservation', join_source, reservation_old, reservation_new, join_file, reservation_title, 'expect(fixture.context.dedupe.has(pendingKey)).toBe(false);', 1),
              ('lost-receipt-guard', receipt_file, receipt_old, receipt_new, 'src/gateway/session-access-authority.test.ts', 'fences receipt expiry without attaching it to retained actor or session lifetime', 'expect(invoke).toThrow("receipt expired");', 1),
              ('unprepared-profile-policy', profile_file, profile_old, profile_new, 'src/gateway/session-sharing.worker.test.ts', 'rechecks prepared unprepared-role policy at the next worker admission', 'expect(result.error, "prepared role authorization").toBeNull();', 1),
              ('cross-store-invalidation', row_file, row_old, row_new, 'src/gateway/session-utils-store-lookup.test.ts', 'rows through non-row events but fences members, aliases and topology', 'expect(assertCurrent, "unrelated physical store publication").not.toThrow();', 2),
          ]
          records = []
          for label, source, before, after, test_file, title, assertion, expected_failures in controls:
              path = root / source
              original = path.read_bytes()
              text = original.decode()
              assert text.count(before) == 1, f'{label}: candidate hunk drifted; inspect before changing the control'
              test_lines = (root / test_file).read_text().splitlines()
              positions = [i + 1 for i, line in enumerate(test_lines) if line.strip() == assertion]
              assert len(positions) == 1, f'{label}: expected assertion is not uniquely located'
              assertion_line = positions[0]
              report = output / f'{label}.xml'
              env = dict(os.environ)
              env['OPENCLAW_VITEST_FS_MODULE_CACHE_PATH'] = str(pathlib.Path(os.environ['RUNNER_TEMP']) / f'pr-156941-{label}-cache')
              started = time.monotonic()
              try:
                  path.write_text(text.replace(before, after, 1))
                  patch = subprocess.check_output(['git', 'diff', '--no-ext-diff', '--', source])
                  (output / f'{label}.patch').write_bytes(patch)
                  with (output / f'{label}.log').open('w') as log:
                      result = subprocess.run([
                          'node', 'scripts/run-vitest.mjs', test_file,
                          '-t', title, '--maxWorkers=1', '--reporter=default', '--reporter=junit',
                          f'--outputFile={report}',
                      ], env=env, stdout=log, stderr=subprocess.STDOUT)
                  assert result.returncode == 1, f'{label}: expected assertion failure, got exit {result.returncode}'
                  # JUnit records suite-hook failures and unhandled errors separately.
                  # JSON omits unhandled errors. Vitest reports global close errors later.
                  log_text = (output / f'{label}.log').read_text()
                  assert not re.search(r'error during close|close timed out after', log_text), f'{label}: Vitest teardown failed'
                  data = ET.parse(report).getroot()
                  assert data.tag == 'testsuites', f'{label}: unexpected JUnit report'
                  assert int(data.attrib['errors']) == 0 and not data.findall('.//error'), f'{label}: unhandled error is not regression proof'
                  suites = data.findall('testsuite')
                  assert suites and all(int(suite.attrib['errors']) == 0 for suite in suites), f'{label}: suite error is not regression proof'
                  failed = [case for case in data.iter('testcase') if case.findall('failure')]
                  assert len(failed) == expected_failures, f'{label}: unexpected failing-test count'
                  assert int(data.attrib['failures']) == expected_failures, f'{label}: unexpected suite failure'
                  assert len(data.findall('.//failure')) == expected_failures, f'{label}: extra failure message is not regression proof'
                  for case in failed:
                      assert title in case.attrib['name'], f'{label}: unrelated test failed'
                      assert case.find('skipped') is None, f'{label}: expected failing case was skipped'
                      failures = case.findall('failure')
                      assert len(failures) == 1, f'{label}: test has multiple errors'
                      for failure in failures:
                          assert failure.attrib['type'] == 'AssertionError', f'{label}: failure had the wrong type'
                          detail = failure.attrib['message'] + '\n' + ''.join(failure.itertext())
                          assert re.search(re.escape(pathlib.Path(test_file).name) + ':' + str(assertion_line) + r'(?::|\b)', detail), f'{label}: failure missed the intended assertion'
                          if test_file == sql_file:
                              assert re.search(r'\b(?:SELECT|PRAGMA|INSERT|CREATE)\b', detail, re.I), f'{label}: SQL evidence missing'
                  records.append({'control': label, 'source': source, 'test': test_file, 'assertionLine': assertion_line, 'failedTests': [case.attrib['name'] for case in failed], 'wallSeconds': round(time.monotonic() - started, 3)})
              finally:
                  path.write_bytes(original)
                  subprocess.run(['git', 'diff', '--exit-code', '--', source], check=True)
                  (output / 'negative-controls.json').write_text(json.dumps(records, indent=2) + '\n')
          PY

      - name: Verify restored candidate source
        shell: bash
        run: git diff --exit-code -- src test

      - name: Upload task proof
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: pr-156941-isolated-proof-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/pr-156941-proof/
          if-no-files-found: error
          retention-days: 7
