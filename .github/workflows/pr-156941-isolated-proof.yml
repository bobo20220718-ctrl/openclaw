# Task-only integration proof with pinned candidate and baseline identities.
# This workflow creates proof artifacts; it cannot land or publish.
name: PR 156941 isolated proof
run-name: PR 156941 isolated proof

on:
  push:
    branches: [test/pr-156941-isolated-proof]

permissions:
  contents: read

concurrency:
  group: pr-156941-isolated-proof
  cancel-in-progress: false

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"
  CANDIDATE_SHA: 850cfd2b1dfb3fe9be0bd5d261761772ba3857c6
  BASE_SHA: 5076c4156b7037b72f4e0eb910906f3569383685
  CONTRIBUTOR_SHA: 17487454baa68c8901b1c9c84393135e93748a55
  BEFORE_FIX_SHA: e9dd74b55fd92227b4da8d5ea8a248d0e7dca304
  NODE_VERSION: "24.21.0"

jobs:
  proof:
    if: github.ref == 'refs/heads/test/pr-156941-isolated-proof'
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    steps:
      - name: Validate immutable proof inputs
        shell: bash
        run: |
          set -euo pipefail
          [[ "$CANDIDATE_SHA" =~ ^[0-9a-f]{40}$ ]]
          [[ "$BASE_SHA" =~ ^[0-9a-f]{40}$ ]]
          [[ "$RUNNER_ENVIRONMENT" == github-hosted ]]
          PROOF_DIR="$RUNNER_TEMP/pr-156941-proof"
          SQLMEASURE_PRIVATE_DIR="$RUNNER_TEMP/pr-156941-sqlmeasure-private"
          printf 'PROOF_DIR=%s\nSQLMEASURE_PRIVATE_DIR=%s\n' "$PROOF_DIR" "$SQLMEASURE_PRIVATE_DIR" >> "$GITHUB_ENV"
          mkdir -p "$PROOF_DIR"

      - name: Checkout exact candidate without retained credentials
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ env.CANDIDATE_SHA }}
          fetch-depth: 1
          persist-credentials: false
          submodules: false

      - name: Verify isolated checkout and fetch public comparison sources
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json, os, pathlib, subprocess
          root = pathlib.Path(os.environ['GITHUB_WORKSPACE'])
          assert subprocess.check_output(['git', 'rev-parse', 'HEAD'], text=True).strip() == os.environ['CANDIDATE_SHA']
          secret_names = (
              'OPENAI_API_KEY', 'ANTHROPIC_API_KEY', 'GEMINI_API_KEY', 'GOOGLE_API_KEY',
              'GH_TOKEN', 'GITHUB_TOKEN', 'NPM_TOKEN', 'NODE_AUTH_TOKEN',
              'AWS_ACCESS_KEY_ID', 'AWS_SECRET_ACCESS_KEY', 'AWS_SESSION_TOKEN',
              'GOOGLE_APPLICATION_CREDENTIALS', 'SSH_AUTH_SOCK',
          )
          assert not any(os.environ.get(name) for name in secret_names), 'Unexpected task credential in proof environment'
          credential_config = subprocess.run(
              ['git', 'config', '--get-regexp', r'http\..*extraheader'],
              text=True, stdout=subprocess.PIPE, stderr=subprocess.PIPE,
          )
          assert credential_config.returncode == 1, 'Git authentication remained after checkout'
          evidence = {key: os.environ[key] for key in ('CANDIDATE_SHA', 'BASE_SHA', 'CONTRIBUTOR_SHA', 'BEFORE_FIX_SHA')}
          evidence['runner'] = os.environ['RUNNER_ENVIRONMENT']
          evidence['negativeControlKind'] = 'source-derived pre-fix hunks on the exact candidate, not a full old-main run'
          pathlib.Path(os.environ['PROOF_DIR'], 'identity.json').write_text(json.dumps(evidence, indent=2) + '\n')
          PY
          git -c core.hooksPath=/dev/null fetch --no-tags --depth=1 \
            https://github.com/openclaw/openclaw.git "$BASE_SHA" "$CONTRIBUTOR_SHA" "$BEFORE_FIX_SHA"

      - name: Checkout reviewed measurement sources from the exact proof commit
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          path: .proof-assets
          fetch-depth: 1
          persist-credentials: false
          submodules: false
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            /.sqlmeasure/run.mts
            /.sqlmeasure/observer.cjs
            /.sqlmeasure/calibrate.cjs
            /.sqlmeasure/analyze.py

      - name: Materialize measurement sources without historical artifacts
        shell: bash
        run: |
          set -euo pipefail
          test ! -e .sqlmeasure
          mkdir .sqlmeasure
          for source in run.mts observer.cjs calibrate.cjs analyze.py; do
            cp ".proof-assets/.sqlmeasure/$source" ".sqlmeasure/$source"
          done
          sha256sum .sqlmeasure/run.mts .sqlmeasure/observer.cjs \
            .sqlmeasure/calibrate.cjs .sqlmeasure/analyze.py > "$PROOF_DIR/sqlmeasure-source.sha256"

      - name: Setup maintained Node and pnpm toolchain
        uses: ./.github/actions/setup-node-env
        with:
          node-version: "24.21.0"
          install-bun: "false"
          cache-mode: "off"
          semantic-checks: "true"

      - name: Install ripgrep for baseline ratchets
        shell: bash
        run: |
          set -euo pipefail
          if command -v rg >/dev/null 2>&1; then
            exit 0
          fi
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends ripgrep

      - name: Build candidate
        env:
          OUTPUT_SOURCE_MAPS: "1"
          OPENCLAW_BUILD_PRIVATE_QA: "1"
        shell: bash
        run: |
          set -euo pipefail
          /usr/bin/time -v -o "$PROOF_DIR/build.time.txt" pnpm build 2>&1 | tee "$PROOF_DIR/build.log"

      - name: Calibrate main-thread and worker-thread SQL observation
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$PROOF_DIR/sqlmeasure-calibration"
          printf 'calibration\n' > "$PROOF_DIR/sqlmeasure-calibration/phase"
          SQLMEASURE_OUT="$PROOF_DIR/sqlmeasure-calibration" \
            NODE_OPTIONS="--require=$PWD/.sqlmeasure/observer.cjs --enable-source-maps" \
            node .sqlmeasure/calibrate.cjs
          python3 - <<'PY'
          import json, os, pathlib
          root = pathlib.Path(os.environ['PROOF_DIR'], 'sqlmeasure-calibration')
          threads = set()
          for trace in root.glob('sql-*.jsonl'):
              rows = [json.loads(line) for line in trace.read_text().splitlines()]
              process = next(row for row in rows if isinstance(row, dict) and row.get('type') == 'process')
              sites = {row['id']: row for row in rows if isinstance(row, dict) and row.get('type') == 'site'}
              calls = [sites[row[1]] for row in rows if isinstance(row, list)]
              assert len(calls) == 8 and all(call['ok'] for call in calls), 'Observer lost calibration calls'
              assert sum(call['method'] == 'prepare' for call in calls) == 2, 'Observer preparation count changed'
              threads.add('main' if process['isMainThread'] else 'worker')
          assert threads == {'main', 'worker'}, 'Observer did not instrument both thread classes'
          maps = list(pathlib.Path('dist').rglob('*.map'))
          assert any(any('src/gateway/server-methods/chat-send-session.ts' in source for source in json.loads(item.read_text()).get('sources', [])) for item in maps), 'First-turn source map missing'
          PY

      - name: Run the complete synthetic SQL measurement workload
        id: sqlmeasure
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$SQLMEASURE_PRIVATE_DIR"
          # Raw connect evidence can contain newly minted fixture credentials.
          # Keep all raw logs/state outside the uploaded proof directory.
          PROOF_DIR="$SQLMEASURE_PRIVATE_DIR" \
            node --import ./scripts/tsx.mjs .sqlmeasure/run.mts \
            > "$SQLMEASURE_PRIVATE_DIR/harness.log" 2>&1

      - name: Analyze SQL attribution and export only redacted proof
        if: ${{ always() && !cancelled() && steps.sqlmeasure.outcome != 'skipped' }}
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json, os, pathlib, subprocess
          private = pathlib.Path(os.environ['SQLMEASURE_PRIVATE_DIR'])
          runs = list(private.glob('sqlmeasure-run-*'))
          assert len(runs) == 1, 'Expected exactly one measurement run'
          run = runs[0]
          evidence = json.loads((run / 'evidence.json').read_text())
          public = pathlib.Path(os.environ['PROOF_DIR'], 'sqlmeasure')
          public.mkdir()
          secret_fields = {'deviceToken', 'deviceTokens', 'token', 'password', 'secret', 'privateKey', 'apiKey'}
          secret_values = set()
          def collect(value, secret=False):
              if isinstance(value, dict):
                  for key, item in value.items(): collect(item, secret or key in secret_fields)
              elif isinstance(value, list):
                  for item in value: collect(item, secret)
              elif secret and isinstance(value, str) and value:
                  secret_values.add(value)
          collect(evidence)
          def redact(value):
              if isinstance(value, dict):
                  return {key: '[redacted]' if key in secret_fields else redact(item) for key, item in value.items()}
              if isinstance(value, list): return [redact(item) for item in value]
              if isinstance(value, str):
                  for secret in sorted(secret_values, key=len, reverse=True): value = value.replace(secret, '[redacted]')
              return value
          (public / 'evidence.json').write_text(json.dumps(redact(evidence), indent=2) + '\n')
          analysis = subprocess.run(['python3', '.sqlmeasure/analyze.py', str(run)], text=True, stdout=subprocess.PIPE, stderr=subprocess.STDOUT)
          (public / 'summary.log').write_text(redact(analysis.stdout))
          if (run / 'analysis.json').is_file():
              (public / 'analysis.json').write_text(json.dumps(redact(json.loads((run / 'analysis.json').read_text())), indent=2) + '\n')
          # These traces contain SQL source text and stacks, never statement bindings.
          for trace in run.glob('sql-*.jsonl'):
              rows = [redact(json.loads(line)) for line in trace.read_text().splitlines()]
              (public / trace.name).write_text(''.join(json.dumps(row) + '\n' for row in rows))
          assert analysis.returncode == 0, 'SQL attribution failed; inspect redacted summary'
          assert evidence.get('head') == os.environ['CANDIDATE_SHA'], 'Measurement candidate identity changed'
          assert evidence.get('ok') is True and 'error' not in evidence, 'Full measurement workload failed; inspect redacted evidence'
          assert len(evidence['turns']) == 13 and all(turn['result']['status'] == 'ok' for turn in evidence['turns']), 'Expected all thirteen synthetic turns'
          assert evidence['childTerminal']['status'] == 'ok' and evidence['compaction']['compacted'] is True
          assert any(entry.get('status') == 'ok' for entry in evidence['cronRuns']['entries']), 'Synthetic cron did not succeed'
          assert evidence['shutdown'] == [0, None], 'Gateway did not shut down cleanly'
          # Phase 02 includes sessions.create and background settlement. Preserve
          # totals + stack attribution; the focused boundary tests own the zero-SQL claim.
          PY

      - name: Compare the exact candidate against released Plugin SDK selectors
        shell: bash
        run: |
          set -euo pipefail
          # This task does not modify the SDK comparison tool or its public renderer.
          git diff --exit-code "$BASE_SHA" "$CANDIDATE_SHA" -- \
            scripts/plugin-sdk-api-diff.mts src/plugin-sdk/api-diff.ts \
            scripts/plugin-sdk-api-release-evidence.mjs \
            scripts/lib/npm-json-output.mts scripts/lib/release-version.mjs \
            scripts/openclaw-npm-extended-stable-release.mjs
          bases_json="$(node --input-type=module <<'NODE'
          import { execFileSync } from 'node:child_process';
          import { readFileSync } from 'node:fs';
          import { resolveNpmJsonEntries } from './scripts/lib/npm-json-output.mts';
          import { parseReleaseVersion } from './scripts/lib/release-version.mjs';
          import { resolveNpmPreflightSdkSelectors } from './scripts/openclaw-npm-extended-stable-release.mjs';
          const selectors = resolveNpmPreflightSdkSelectors(JSON.parse(readFileSync('package.json', 'utf8')).version, 'latest');
          const entries = resolveNpmJsonEntries(JSON.parse(execFileSync('npm', ['view', 'openclaw', 'dist-tags', '--json'], { encoding: 'utf8' })));
          if (entries.length !== 1) throw new Error('Expected one public selector map');
          const refs = Object.fromEntries(selectors.map(selector => {
            const version = entries[0]?.[selector];
            if (typeof version !== 'string' || !parseReleaseVersion(version)) throw new Error('Invalid public release selector');
            return [selector, `v${version}`];
          }));
          process.stdout.write(JSON.stringify(refs));
          NODE
          )"
          mapfile -t refs < <(jq -r '.[] | "+refs/tags/\(.):refs/tags/\(.)"' <<< "$bases_json" | sort -u)
          git -c core.hooksPath=/dev/null fetch --no-tags --depth=1 origin "${refs[@]}"
          if [[ "$(jq 'length' <<< "$bases_json")" == 2 ]]; then
            base_args=(--bases-json "$bases_json")
          else
            base_args=(--base "$(jq -r '.[]' <<< "$bases_json")")
          fi
          pnpm plugin-sdk:api:diff -- \
            --head "$CANDIDATE_SHA" "${base_args[@]}" \
            --evidence "$PROOF_DIR/plugin-sdk-release-evidence.json" \
            --json "$PROOF_DIR/plugin-sdk-release-diff.json" \
            --summary "$GITHUB_STEP_SUMMARY" \
            > "$PROOF_DIR/plugin-sdk-release.log" 2>&1

      - name: Run merged-main integration and import-closure proof
        env:
          OPENCLAW_VITEST_FS_MODULE_CACHE_PATH: ${{ runner.temp }}/pr-156941-positive-cache
        shell: bash
        run: |
          set -euo pipefail
          /usr/bin/time -v -o "$PROOF_DIR/focused.time.txt" \
            node scripts/run-vitest.mjs \
            src/gateway/server.chat-membership-authority.product.test.ts \
            src/gateway/server-methods/chat-send-admission.reads.test.ts \
            src/gateway/server-methods/chat-send-profile-binding.test.ts \
            src/gateway/server-methods/chat.directive-tags.test.ts \
            src/gateway/session-access-authority.test.ts \
            src/gateway/session-utils-store-worker.test.ts \
            src/gateway/session-utils-store-lookup.test.ts \
            src/gateway/session-utils-store-sources.test.ts \
            src/config/sessions/session-entry-read.worker.test.ts \
            src/config/sessions/session-entry-readonly.worker.test.ts \
            src/gateway/server-methods/sessions-mutations.owner.test.ts \
            src/agents/embedded-agent-runner/run/model-setup.ownership.test.ts \
            src/auto-reply/reply/session.test.ts \
            src/agents/embedded-agent-runner/run/lane-controller.writer-claim.test.ts \
            src/auto-reply/reply/dispatch-from-config.owner-metadata.test.ts \
            src/state/openclaw-agent-db-resources.test.ts \
            src/gateway/server-methods/usage.sessions-usage-owner-attribution.integration.test.ts \
            test/scripts/runtime-process-build-graph.test.ts \
            src/auto-reply/reply/get-reply.imports.test.ts \
            src/state/openclaw-state.worker.imports.test.ts \
            --maxWorkers=1 --reporter=default 2>&1 | tee "$PROOF_DIR/focused.log"
          python3 - <<'PYCODE'
          import os, pathlib, re
          output = pathlib.Path(os.environ['PROOF_DIR'], 'focused.log').read_text()
          output = re.sub(r'\x1b\[[0-9;]*m', '', output)
          assert not re.search(r'(?mi)^\s*(?:error during close|close timed out after)|^[^\n]*⎯[^\n]*Unhandled (?:Error|Rejection|Exception)', output), 'Focused test teardown or unhandled error remains'
          PYCODE

      - name: Run explicit worker ratchet and Madge checks
        shell: bash
        run: |
          set -euo pipefail
          pnpm check:database-worker-ratchet --base "$BASE_SHA" 2>&1 | tee "$PROOF_DIR/worker-ratchet.log"
          pnpm check:test-mock-exports --base "$BASE_SHA" 2>&1 | tee "$PROOF_DIR/mock-exports-ratchet.log"
          pnpm check:madge-import-cycles 2>&1 | tee "$PROOF_DIR/madge.log"

      - name: Verify restored candidate source
        shell: bash
        run: git diff --exit-code -- src test

      - name: Upload task proof
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: pr-156941-isolated-proof-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/pr-156941-proof/
          if-no-files-found: error
          retention-days: 7
